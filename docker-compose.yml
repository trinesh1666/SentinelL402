services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: sentinell402-api

    env_file:
      - .env

    environment:
      OLLAMA_URL: http://host.docker.internal:11434/api/generate

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./backend/data:/app/data

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    mem_limit: 2g
    cpus: "2.0"

    read_only: true

    tmpfs:
      - /tmp

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s